name: Build International Truck Simulator APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/android-build.yml'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: 6000.0.23f1
          targetPlatform: Android
          buildMethod: InternationalTruckSimulator.Editor.ProjectBootstrap.PrepareAndroidBuild
          allowDirtyBuild: true
          customParameters: -nographics

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InternationalTruckSimulator-Android-APK
          path: Build/InternationalTruckSimulator.apk
          if-no-files-found: error
          retention-days: 14
