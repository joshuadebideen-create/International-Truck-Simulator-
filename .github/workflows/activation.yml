
name: Check Unity Build Setup

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Confirm repository is accessible
        run: |
          echo "GitHub Actions is working."
          echo "Checking for Unity project files..."
          find . -name ProjectVersion.txt -print



