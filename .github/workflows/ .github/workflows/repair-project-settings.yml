
name: Inspect Unity Project Settings

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Check Unity project files
        run: |
          echo "Unity project version:"
          cat ProjectSettings/ProjectVersion.txt

          echo "Checking required project files:"
          test -f Packages/manifest.json && echo "manifest.json exists"
          test -f ProjectSettings/ProjectSettings.asset && echo "ProjectSettings.asset exists" || echo "ProjectSettings.asset is missing"
          test -f ProjectSettings/EditorBuildSettings.asset && echo "EditorBuildSettings.asset exists" || echo "EditorBuildSettings.asset is missing"

      - name: Save project file report
        run: |
          mkdir -p report
          find Assets Packages ProjectSettings -maxdepth 2 -type f | sort > report/project-files.txt

      - name: Upload project file report
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Project-File-Report
          path: report/project-files.txt
          retention-days: 7
